name: lint

on:
  push:
  pull_request:

jobs:
  php-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'

      - name: Check every tracked PHP file parses
        run: |
          status=0
          while IFS= read -r file; do
            php -l "$file" || status=1
          done < <(git ls-files '*.php')
          exit $status
